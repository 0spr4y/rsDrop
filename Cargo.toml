[package]
name = "rsDrop"
version = "0.1.0"
edition = "2024"
description = "A tiny, end-to-end encrypted, in-memory secrets sharing app"
license = "MIT"
repository = "https://github.com/0spr4y/rsDrop"
readme = "README.md"

[dependencies]
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "fs"] }
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
subtle = "2" # Constant-time comparison of the create token
zeroize = "1" # Optimization-resistant buffer clearing before release
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }

clap = { version = "4", features = ["derive"] } # Command-line argument parsing
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] } # Axum server with TLS support
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] } # TLS, using the ring crypto provider

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
strip = true        # Drop symbols: smaller binary and image
lto = true
codegen-units = 1
